name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cotizador_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 4001
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cotizador_ci
      PGSSL: "false"
      JWT_SECRET: ci-test-secret-not-for-prod
      CORS_ORIGIN: http://localhost:4000
      # Sin SMTP real en CI a propósito: el envío de correo falla (se loguea, no
      # rompe la request) porque los tests no dependen de que el correo salga de
      # verdad, solo de que los endpoints respondan bien.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

      - name: Levantar el servidor en segundo plano
        run: node dist/server.js &

      - name: Esperar a que /health responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/health && exit 0
            sleep 1
          done
          echo "El backend no respondió a tiempo" && exit 1

      - name: Tests
        run: npm test
